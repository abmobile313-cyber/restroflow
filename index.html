<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a1224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>RestroFlow — Restaurant & Hotel POS + Stock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#110607;--bg2:#190a0d;--panel:#1f0d11;--panel2:#2a131a;--line:rgba(212,166,42,.20);--line2:rgba(255,255,255,.08);
  --gold:#d4a62a;--gold2:#b58a1b;--maroon:#7b1f33;--maroon2:#5a1224;--cyan:#22d3ee;
  --text:#f6eee2;--mut:#a99c8c;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--shadow:0 10px 30px rgba(0,0,0,.45);
  --r:14px;--side:218px;
}
[data-theme=light]{
  --bg:#f6f1ea;--bg2:#efe7dc;--panel:#ffffff;--panel2:#f8f2e9;--line:rgba(123,31,51,.18);--line2:rgba(0,0,0,.08);
  --text:#2a1418;--mut:#7a6a62;--shadow:0 8px 24px rgba(60,20,30,.12);--gold:#a8780f;--gold2:#8a6209;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.hide{display:none!important}
#app{height:100%}
.shell{display:grid;grid-template-columns:var(--side) 1fr;height:100%}
.side{background:linear-gradient(180deg,var(--maroon2),#2a0a12 70%);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
[data-theme=light] .side{background:linear-gradient(180deg,#7b1f33,#5a1224);color:#fff}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#8a5f0a);display:grid;place-items:center;font-weight:800;color:#2a0a12;font-size:18px}
.brand b{display:block;font-size:15px;line-height:1.1;color:#fff}.brand small{color:#e3c779;font-size:11px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:#f1dfc9;text-decoration:none;cursor:pointer;font-weight:600;position:relative}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:linear-gradient(90deg,rgba(212,166,42,.28),rgba(212,166,42,.06));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav a .ic{width:22px;text-align:center;font-size:17px}
.nav a .dot{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.side .foot{margin-top:auto;padding:8px;font-size:12px;color:#e3c779}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line2);background:var(--bg2)}
.top h1{font-size:18px}.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line2);font-size:12px;color:var(--mut)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.sdot.ok{background:var(--ok)}.sdot.err{background:var(--bad)}.sdot.sync{background:var(--warn)}
.content{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch;min-width:0}
.bnav{display:none}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card.gl{border-color:var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a0a12;border-color:transparent}
.btn.mar{background:linear-gradient(135deg,var(--maroon),var(--maroon2));border-color:var(--line);color:#fff}
.btn.dang{background:rgba(248,113,113,.14);color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn.ok{background:rgba(52,211,153,.15);color:var(--ok);border-color:rgba(52,211,153,.4)}
.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}.btn.lg{padding:13px 18px;font-size:15px}.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a0a12;border-color:transparent}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel2);color:var(--mut)}
.badge.ok{background:rgba(52,211,153,.16);color:var(--ok)}.badge.warn{background:rgba(251,191,36,.16);color:var(--warn)}.badge.bad{background:rgba(248,113,113,.16);color:var(--bad)}.badge.gold{background:rgba(212,166,42,.16);color:var(--gold)}
.mut{color:var(--mut)}.gold{color:var(--gold)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.b{font-weight:700}.r{text-align:right}.c{text-align:center}.sm{font-size:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=checkbox]{width:auto;accent-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg2)}
table.t th.r{text-align:right}table.t th.c{text-align:center}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover td{background:rgba(212,166,42,.06)}
.tw{overflow:auto;border-radius:12px;border:1px solid var(--line2);max-height:calc(100vh - 230px)}
.kpi{padding:14px;border-radius:var(--r);background:linear-gradient(135deg,rgba(123,31,51,.55),rgba(42,19,26,.9));border:1px solid var(--line)}
[data-theme=light] .kpi{background:linear-gradient(135deg,#fff,#f5e9d8)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px;display:block;margin-top:2px}.kpi i{font-style:normal;font-size:12px;color:var(--mut)}
.title{font-size:16px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}
/* tables */
.tbl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tcard{border-radius:14px;padding:12px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tcard:hover{border-color:var(--gold)}.tcard.busy{background:linear-gradient(135deg,rgba(123,31,51,.7),rgba(60,15,28,.9));border-color:var(--gold)}
.tcard.pend{border-color:var(--cyan)}.tcard b{font-size:16px}
/* order */
.ordr{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;height:100%}
.ordr .menu{display:flex;flex-direction:column;min-height:0;min-width:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow:auto;padding:2px 2px 80px;align-content:start}
.dish{border:1px solid var(--line2);background:var(--panel);border-radius:13px;padding:11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px;position:relative}
.dish:hover{border-color:var(--gold)}.dish:active{transform:scale(.97)}
.dish .nm{font-weight:700;line-height:1.2}.dish .pr{color:var(--gold);font-weight:700;margin-top:auto}
.dish.out{opacity:.5}
.veg{width:13px;height:13px;border:1.5px solid #22c55e;display:inline-grid;place-items:center;border-radius:3px;flex:none}.veg::after{content:"";width:6px;height:6px;border-radius:50%;background:#22c55e}
.veg.nv{border-color:#ef4444}.veg.nv::after{background:#ef4444}.veg.eg{border-color:#f59e0b}.veg.eg::after{background:#f59e0b}
.cart{display:flex;flex-direction:column;min-height:0;height:100%}
.cart .items{flex:1;overflow:auto;margin:8px 0}
.ci{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line2)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stp button{border:0;background:var(--panel2);width:30px;height:30px;font-size:17px;cursor:pointer}.stp span{min-width:28px;text-align:center;font-weight:700}
.sum{font-size:13px}.sum div{display:flex;justify-content:space-between;padding:2px 0}.sum .tot{font-size:20px;font-weight:800;color:var(--gold);border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.cartbar{display:none}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;backdrop-filter:blur(3px)}
.mdl{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:94vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mdl.wide{width:min(860px,100%)}
.mdl header{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center}
.mdl .bd{padding:16px;overflow:auto}.mdl footer{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111;color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:99;box-shadow:var(--shadow);max-width:90vw}
.toast.bad{border-color:var(--bad)}
.rec{background:#fff;color:#111;border-radius:6px;padding:12px;font:12px/1.35 "Courier New",monospace;max-width:330px;margin:0 auto}
.rec h4{margin:0;text-align:center;font-size:15px}.rec .c{text-align:center}.rec hr{border:0;border-top:1px dashed #555;margin:6px 0}
.rec table{width:100%;border-collapse:collapse}.rec td,.rec th{padding:1px 0;vertical-align:top;font-size:12px}.rec .r{text-align:right}.rec .tt{font-size:15px;font-weight:700}
#printRoot{display:none}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:16px;background:radial-gradient(900px 500px at 20% 0,rgba(123,31,51,.5),transparent),radial-gradient(700px 400px at 100% 100%,rgba(212,166,42,.15),transparent),var(--bg)}
.lcard{width:min(400px,100%);text-align:center}
.pin{display:flex;gap:10px;justify-content:center;margin:12px 0}.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold)}.pin i.f{background:var(--gold)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keys button{padding:15px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);font-size:20px;font-weight:700;cursor:pointer}
.keys button:active{background:var(--maroon)}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.rl button{padding:14px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:700}.rl button.on{border-color:var(--gold);background:rgba(212,166,42,.14);color:var(--gold)}
.rline{display:grid;grid-template-columns:1.6fr .9fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.help{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);color:var(--text);padding:10px 12px;border-radius:12px;font-size:13px}
.bar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--maroon),var(--gold))}
@media(max-width:900px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr auto}.side{display:none}
  .bnav{display:flex;background:var(--maroon2);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));overflow-x:auto}
  .bnav a{flex:1;min-width:0;text-align:center;color:#f1dfc9;padding:6px 1px;font-size:10px;font-weight:600;cursor:pointer;position:relative}
  .bnav a .ic{display:block;font-size:19px}.bnav a.on{color:var(--gold)}
  .content{padding:12px}.top{padding:8px 12px}
  .ordr{grid-template-columns:minmax(0,1fr)}.ordr .cart{position:fixed;inset:0;z-index:40;background:var(--bg);padding:12px;transform:translateY(100%);transition:.25s}
  .ordr .cart.open{transform:none}
  .cartbar{display:flex;position:sticky;bottom:0;left:0;right:0;margin-top:8px;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a0a12;padding:12px 16px;border-radius:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
  .two{grid-template-columns:1fr}.three:not(.p3){grid-template-columns:1fr}.rline{grid-template-columns:1fr 1fr auto auto}
  .tw{max-height:none}.toast{bottom:90px}
  .dgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
@media print{
  body *{visibility:hidden}
  #printRoot,#printRoot *{visibility:visible}
  #printRoot{display:block!important;position:absolute;left:0;top:0;width:100%}
  .rec{max-width:none;width:76mm;box-shadow:none;padding:0;margin:0}
  @page{margin:2mm}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="printRoot"></div>
<script>
'use strict';
/* ============ RestroFlow core: utils, state, storage, cloud sync ============ */
const COLLS=['ingredients','bases','dishes','categories','tables','orders','purchases','suppliers','wastes','batches','adjusts'];
const EVENT_COLLS=['orders','purchases','wastes','batches','adjusts']; // loaded with a time window from cloud
const FACT={kg:1000,l:1000,pcs:1}, BASEU={kg:'g',l:'ml',pcs:'pcs'};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const clone=o=>JSON.parse(JSON.stringify(o));
const trimN=n=>{n=Math.round(n*100)/100;return String(n)};
const DAY=864e5;
function sod(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function money(n){const sym=(S&&S.settings&&S.settings.curr)||'₹';n=r2(n||0);return (n<0?'-':'')+sym+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})}
function money2(n){return (n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fq(base,unit){base=base||0;const a=Math.abs(base);
  if(unit==='kg')return a>=1000?trimN(base/1000)+' kg':trimN(base)+' g';
  if(unit==='l')return a>=1000?trimN(base/1000)+' L':trimN(base)+' ml';
  return trimN(base)+' pcs'}
function fdate(t){return new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function ftime(t){return new Date(t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
function fdt(t){return fdate(t)+', '+ftime(t)}
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m'}
function ymd(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

const SS={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
/* ---------- state ---------- */
let S=null, ME=null;
function defSettings(){return{
  setupDone:false,
  biz:{name:'My Restaurant',tagline:'',address:'',phone:'',gstin:'',fssai:'',footer:'Thank you! Visit again.'},
  taxMode:'regular',defGst:5,inclusive:false,svcOn:false,svcPct:0,roundOff:true,curr:'₹',
  blockOut:false,theme:'dark',paper:'80',autoKot:true,
  pins:{owner:'',cashier:''},upi:''
}}
function emptyState(){const s={v:1,settings:defSettings(),counters:{bill:0,order:0}};COLLS.forEach(c=>s[c]={});return s}
function normalize(st){const e=emptyState();st=st||{};COLLS.forEach(c=>{e[c]=st[c]||{}});e.settings=Object.assign(defSettings(),st.settings||{});e.settings.biz=Object.assign(defSettings().biz,(st.settings||{}).biz||{});e.settings.pins=Object.assign({owner:'',cashier:''},(st.settings||{}).pins||{});e.counters=Object.assign({bill:0,order:0},st.counters||{});return e}

/* ---------- local storage (IndexedDB, fallback localStorage) ---------- */
const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('restroflow',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
  get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result==null?null:q.result);q.onerror=()=>res(null)}catch(e){res(null)}})},
  set(k,v){return new Promise(res=>{if(!this.db)return res(false);try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
};
let _pt=null;
async function flushNow(){clearTimeout(_pt);_pt=null;const ok=await IDB.set('state',S);if(!ok){try{localStorage.setItem('rf_state',JSON.stringify(S))}catch(e){}}}
function persist(){clearTimeout(_pt);_pt=setTimeout(flushNow,300)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&_pt)flushNow()});window.addEventListener('pagehide',()=>{if(_pt)flushNow()});
async function loadLocal(){await IDB.open();let st=await IDB.get('state');if(!st){try{const t=localStorage.getItem('rf_state');if(t)st=JSON.parse(t)}catch(e){}}return st}

/* ---------- render scheduler ---------- */
let _rt=null;function scheduleRender(){clearTimeout(_rt);_rt=setTimeout(()=>{if(window.render)window.render()},60)}

/* ---------- batch writes (local first, cloud mirrored) ---------- */
function batch(){const ops=[];return{
  set(c,o){o=clone(o);o.id=o.id||uid();if(EVENT_COLLS.includes(c)&&!o.ts)o.ts=Date.now();S[c][o.id]=o;ops.push(['set',c,o]);return o},
  inc(c,id,d){const o=S[c][id];if(o)o.stock=(o.stock||0)+d;ops.push(['inc',c,id,d])},
  del(c,id){delete S[c][id];ops.push(['del',c,id])},
  commit(){persist();if(Cloud.on)Cloud.write(ops);scheduleRender()}}}
function save(c,o){const b=batch();const r=b.set(c,o);b.commit();return r}
function saveSettings(){persist();if(Cloud.on)Cloud.setDoc('settings',S.settings);scheduleRender()}
async function nextNo(k){
  if(Cloud.on&&Cloud.ready){try{const n=await Cloud.nextNo(k);S.counters[k]=n;return n}catch(e){}}
  S.counters[k]=(S.counters[k]||0)+1;persist();return S.counters[k]}

/* ---------- hashing (PIN) ---------- */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rf1:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa('rf1:'+s)}}

/* ---------- Firebase cloud sync (optional, free Spark plan) ---------- */
const FBV='10.14.1';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script '+src));document.head.appendChild(s)})}
const Cloud={on:false,ready:false,status:'off',cfg:null,db:null,base:'restaurants/main',unsubs:[],err:'',
  getCfg(){try{return JSON.parse(localStorage.getItem('rf_cloud')||'null')}catch(e){return null}},
  setCfg(c){if(c)localStorage.setItem('rf_cloud',JSON.stringify(c));else localStorage.removeItem('rf_cloud')},
  setStatus(s,e){this.status=s;this.err=e||'';const el=$('#syncdot');if(el){el.className='sdot '+(s==='ok'?'ok':s==='err'?'err':s==='off'?'':'sync')}const t=$('#synctxt');if(t)t.textContent=this.label()},
  label(){return{off:'Local only',ok:'Cloud synced',sync:'Syncing…',err:'Sync error'}[this.status]||''},
  async start(){
    const c=this.getCfg();if(!c){this.on=false;return}
    this.on=true;this.setStatus('sync');
    try{
      if(!window.firebase){const b='https://www.gstatic.com/firebasejs/'+FBV+'/';await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js')}
      if(!firebase.apps.length)firebase.initializeApp(c.cfg);
      const auth=firebase.auth();
      await new Promise((res,rej)=>{let done=false,un=null;un=auth.onAuthStateChanged(async u=>{if(done)return;if(u){done=true;un&&un();res()}else{try{await auth.signInWithEmailAndPassword(c.email,c.pass)}catch(e){if(!done){done=true;un&&un();rej(e)}}}})});
      this.db=firebase.firestore();
      try{await this.db.enablePersistence({synchronizeTabs:true})}catch(e){}
      this.ready=true;await this.attach();this.setStatus('ok')
    }catch(e){console.warn(e);this.ready=false;this.setStatus('err',e.message||String(e))}
  },
  ref(c){return this.db.collection(this.base+'/'+c)},
  async attach(){
    const cutoff=Date.now()-62*DAY;
    // settings
    await new Promise(res=>{let first=true;this.unsubs.push(this.db.doc(this.base+'/meta/settings').onSnapshot(d=>{
      if(d.exists){const v=d.data();S.settings=Object.assign(defSettings(),v);S.settings.biz=Object.assign(defSettings().biz,v.biz||{});S.settings.pins=Object.assign({owner:'',cashier:''},v.pins||{});persist();scheduleRender()}
      else if(first&&S.settings.setupDone){this.setDoc('settings',S.settings)}
      if(first){first=false;res()}
    },e=>{this.setStatus('err',e.message);res()}))});
    // push local data on first connect to an empty cloud
    const probe=await this.db.doc(this.base+'/meta/seed').get().catch(()=>null);
    const cc=this.getCfg();
    if(probe&&!probe.exists){await this.pushAll();await this.db.doc(this.base+'/meta/seed').set({at:Date.now()})}
    else if(probe&&probe.exists&&cc&&!cc.linked){COLLS.forEach(c=>{S[c]={}});persist()} // first link to an existing cloud restaurant: cloud is the source of truth
    if(cc&&!cc.linked&&probe){cc.linked=true;this.setCfg(cc)}
    for(const c of COLLS){
      let q=this.ref(c);if(EVENT_COLLS.includes(c))q=q.where('ts','>=',cutoff);
      this.unsubs.push(q.onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{if(ch.type==='removed')delete S[c][ch.doc.id];else S[c][ch.doc.id]=ch.doc.data()});
        persist();scheduleRender();this.setStatus(snap.metadata.hasPendingWrites?'sync':'ok');
      },e=>{this.setStatus('err',e.message)}));
    }
  },
  clean(o){return JSON.parse(JSON.stringify(o))},
  async pushAll(){
    const ops=[];COLLS.forEach(c=>Object.values(S[c]).forEach(o=>ops.push(['set',c,o])));
    await this.write(ops);await this.setDoc('settings',S.settings);
  },
  async write(ops){
    if(!this.db)return;this.setStatus('sync');
    try{
      for(let i=0;i<ops.length;i+=400){
        const wb=this.db.batch();
        ops.slice(i,i+400).forEach(op=>{
          const [k,c,x,d]=op;
          if(k==='set')wb.set(this.ref(c).doc(x.id),this.clean(x));
          else if(k==='inc')wb.set(this.ref(c).doc(x),{stock:firebase.firestore.FieldValue.increment(d)},{merge:true});
          else if(k==='del')wb.delete(this.ref(c).doc(x));
        });
        await wb.commit();
      }
      this.setStatus('ok');
    }catch(e){console.warn(e);this.setStatus('err',e.message)}
  },
  async setDoc(name,data){if(!this.db)return;try{await this.db.doc(this.base+'/meta/'+name).set(this.clean(data))}catch(e){this.setStatus('err',e.message)}},
  async nextNo(k){const ref=this.db.doc(this.base+'/meta/counters');
    return this.db.runTransaction(async t=>{const d=await t.get(ref);const n=((d.exists&&d.data()[k])||0)+1;t.set(ref,{[k]:n},{merge:true});return n})}
};

'use strict';
/* ============ business logic: costing, stock, tax, orders, reports ============ */
const list=c=>Object.values(S[c]);
const byName=(a,b)=>String(a.name).localeCompare(String(b.name));
const ings=()=>list('ingredients').sort(byName), bases=()=>list('bases').sort(byName);
function refObj(t,id){return t==='i'?S.ingredients[id]:S.bases[id]}
function refName(t,id){const o=refObj(t,id);return o?o.name:'(deleted)'}
function unitCost(t,id){const o=refObj(t,id);return o?(o.cost||0):0}
function isLow(o){return o.min>0&&(o.stock||0)<=o.min}

/* recipe usage for 1 portion (variant factor applied) */
function recipeUse(dish,variant){
  const f=variant&&variant.factor?variant.factor:1,m={};
  (dish.recipe||[]).forEach(l=>{const k=l.t+':'+l.id;m[k]=(m[k]||0)+num(l.qty)*f});
  return Object.entries(m).map(([k,q])=>{const [t,id]=k.split(':');return{t,id,qty:q}})}
function useCost(use){return use.reduce((s,u)=>s+u.qty*unitCost(u.t,u.id),0)}
function dishCost(d,v){return useCost(recipeUse(d,v))}
function variantsOf(d){return d.variants&&d.variants.length?d.variants:[{name:'',price:d.price,factor:1}]}
/* how many portions can still be made from current stock (null = no recipe tracking) */
function canMake(d,v){const use=recipeUse(d,v);if(!use.length)return null;let m=Infinity;use.forEach(u=>{const o=refObj(u.t,u.id);const st=o?(o.stock||0):0;if(u.qty>0)m=Math.min(m,Math.floor(st/u.qty))});return m===Infinity?null:Math.max(0,m)}

/* ---------- tax / bill calculation ---------- */
function calcBill(o){
  const st=S.settings,items=(o.items||[]).filter(i=>i.qty>0);
  const reg=st.taxMode==='regular',incl=st.inclusive&&reg;
  const gross=items.reduce((s,i)=>s+i.price*i.qty,0);
  let disc=0;const d=o.discount;
  if(d&&d.value>0)disc=d.type==='pct'?gross*Math.min(100,d.value)/100:Math.min(d.value,gross);
  disc=r2(disc);
  const lines=items.map(i=>{
    const amt=i.price*i.qty,net=gross>0?amt-disc*(amt/gross):amt;
    const rate=reg?(i.gst==null?st.defGst:i.gst):0;
    const base=incl?net/(1+rate/100):net;return{i,amt,net,rate,base}});
  const baseSum=lines.reduce((s,l)=>s+l.base,0);
  const svc=o.svc&&st.svcPct>0?r2(baseSum*st.svcPct/100):0;
  const groups={};
  lines.forEach(l=>{const sh=baseSum>0?svc*(l.base/baseSum):0;l.taxable=l.base+sh;const g=groups[l.rate]||(groups[l.rate]={rate:l.rate,taxable:0});g.taxable+=l.taxable});
  let cgst=0,sgst=0;
  const tg=Object.values(groups).sort((a,b)=>a.rate-b.rate).map(g=>{g.taxable=r2(g.taxable);g.cgst=r2(g.taxable*g.rate/200);g.sgst=g.cgst;cgst+=g.cgst;sgst+=g.sgst;return g});
  const taxable=r2(lines.reduce((s,l)=>s+l.taxable,0));
  const raw=r2(taxable+cgst+sgst);
  const total=st.roundOff?Math.round(raw):raw;
  const cost=items.reduce((s,i)=>s+(i.cost||0)*i.qty,0);
  return{gross:r2(gross),disc,svc,taxable,groups:tg,cgst:r2(cgst),sgst:r2(sgst),tax:r2(cgst+sgst),raw,round:r2(total-raw),total,cost:r2(cost),count:items.reduce((s,i)=>s+i.qty,0),incl}
}

/* ---------- orders ---------- */
function newOrder(type,tableId,label){return{id:uid(),no:0,type,tableId:tableId||null,label:label||'',status:'open',items:[],createdAt:Date.now(),ts:Date.now(),by:ME?ME.name:'',discount:null,svc:!!S.settings.svcOn,voids:[],customer:{name:'',phone:''},note:''}}
function openOrderFor(tableId){return list('orders').find(o=>o.status==='open'&&o.tableId===tableId)}
function openOrders(){return list('orders').filter(o=>o.status==='open').sort((a,b)=>a.createdAt-b.createdAt)}
function orderTitle(o){const t=o.tableId?S.tables[o.tableId]:null;
  if(o.type==='dine')return t?t.name:'Dine-in';if(o.type==='take')return 'Takeaway'+(o.label?' · '+o.label:'');if(o.type==='delivery')return 'Delivery'+(o.label?' · '+o.label:'');if(o.type==='room')return 'Room '+(o.label||'');return 'Order'}
function addItem(o,dish,vi){
  const vs=variantsOf(dish),v=vs[vi||0]||vs[0];
  const ex=o.items.find(i=>i.dishId===dish.id&&i.vName===v.name&&!i.note&&i.qty>0);
  if(ex){ex.qty++;return ex}
  const use=recipeUse(dish,v);
  const it={uid:uid(),dishId:dish.id,name:dish.name,vName:v.name,price:num(v.price),qty:1,gst:dish.gst==null||dish.gst===''?null:num(dish.gst),note:'',deducted:0,sent:0,use,cost:r2(useCost(use)),veg:dish.veg||'veg'};
  o.items.push(it);return it}
/* commit order: apply stock deltas, save */
async function commitOrder(o,{kot=false}={}){
  const b=batch();let warn=[];
  for(const it of o.items){
    const delta=it.qty-(it.deducted||0);
    if(delta){for(const u of it.use||[]){const c=u.t==='i'?'ingredients':'bases';b.inc(c,u.id,-u.qty*delta)}it.deducted=it.qty}}
  o.items=o.items.filter(i=>i.qty>0);
  const ex=S.orders[o.id];
  if(!o.items.length){if(ex)b.del('orders',o.id);b.commit();return null}
  if(!o.no)o.no=await nextNo('order');
  if(kot)o.items.forEach(i=>i.sent=i.qty);
  o.updatedAt=Date.now();
  b.set('orders',o);b.commit();return S.orders[o.id]}
async function payOrder(o,pays,customer){
  const ord=await commitOrder(o,{kot:true});if(!ord)return null;
  const p=clone(ord);const c=calcBill(p);
  p.bill=Object.assign({},c,{no:await nextNo('bill'),prefix:(S.settings.taxMode==='regular'?'INV':'BILL'),pays,paidAt:Date.now(),by:ME?ME.name:'',mode:S.settings.taxMode,incl:c.incl,lines:p.items.map(i=>({n:i.name+(i.vName?' ('+i.vName+')':''),q:i.qty,p:i.price,gst:i.gst}))});
  if(customer)p.customer=customer;
  p.status='paid';const b=batch();b.set('orders',p);b.commit();return S.orders[p.id]}
/* cancel order (restore stock or treat as wastage) */
async function cancelOrder(o,reason,restore){
  const b=batch();const p=clone(S.orders[o.id]||o);
  if(restore){p.items.forEach(it=>{if(it.deducted)(it.use||[]).forEach(u=>b.inc(u.t==='i'?'ingredients':'bases',u.id,u.qty*it.deducted))});}
  p.status='cancelled';p.cancel={reason,restore,at:Date.now(),by:ME?ME.name:'',cost:r2(p.items.reduce((s,i)=>s+(i.cost||0)*(i.deducted||0),0))};
  if(S.orders[p.id])b.set('orders',p);b.commit()}
async function voidBill(id,restore){
  const o=S.orders[id];if(!o)return;const b=batch();const p=clone(o);
  if(restore)p.items.forEach(it=>(it.use||[]).forEach(u=>b.inc(u.t==='i'?'ingredients':'bases',u.id,u.qty*(it.deducted||it.qty))));
  p.status='void';p.voidAt=Date.now();p.voidBy=ME?ME.name:'';p.voidRestore=!!restore;b.set('orders',p);b.commit()}

/* ---------- purchases / production / waste / count ---------- */
function applyIn(b,c,id,qtyBase,totalCost){ // weighted average cost
  const o=S[c][id];if(!o)return;const st=Math.max(0,o.stock||0);const newCost=qtyBase>0?totalCost/qtyBase:o.cost||0;
  o.cost=r2n((st*(o.cost||0)+qtyBase*newCost)/(st+qtyBase||1));b.set(c,o);b.inc(c,id,qtyBase)}
function r2n(n){return Math.round(n*1e6)/1e6}
function savePurchase(p){ // p:{supplierId,date,items:[{id,qty(base),amount}],paid,note}
  const b=batch();p.total=r2(p.items.reduce((s,i)=>s+i.amount,0));p.ts=p.date||Date.now();p.id=p.id||uid();
  p.items.forEach(i=>{const o=S.ingredients[i.id];if(!o)return;const st=Math.max(0,o.stock||0);const unit=i.qty>0?i.amount/i.qty:o.cost;
    const upd=clone(o);upd.cost=r2n((st*(o.cost||0)+i.qty*unit)/(st+i.qty||1));b.set('ingredients',upd);b.inc('ingredients',o.id,i.qty)});
  if(p.supplierId&&S.suppliers[p.supplierId]){const s=clone(S.suppliers[p.supplierId]);s.balance=r2((s.balance||0)+p.total-(p.paid||0));b.set('suppliers',s)}
  b.set('purchases',p);b.commit();return p}
function delPurchase(id){const p=S.purchases[id];if(!p)return;const b=batch();
  p.items.forEach(i=>b.inc('ingredients',i.id,-i.qty));
  if(p.supplierId&&S.suppliers[p.supplierId]){const s=clone(S.suppliers[p.supplierId]);s.balance=r2((s.balance||0)-p.total+(p.paid||0));b.set('suppliers',s)}
  b.del('purchases',id);b.commit()}
function produceBatch(baseId,qtyBase,lines,note){ // lines:[{id,qty}] ingredient use in base units
  const bs=S.bases[baseId];if(!bs)return;const b=batch();let cost=0;
  lines.forEach(l=>{cost+=l.qty*unitCost('i',l.id);b.inc('ingredients',l.id,-l.qty)});
  const upd=clone(bs);const st=Math.max(0,bs.stock||0);upd.cost=r2n((st*(bs.cost||0)+cost)/(st+qtyBase||1));b.set('bases',upd);b.inc('bases',baseId,qtyBase);
  b.set('batches',{id:uid(),baseId,name:bs.name,unit:bs.unit,qty:qtyBase,cost:r2(cost),lines,note:note||'',by:ME?ME.name:'',ts:Date.now()});b.commit()}
function logWaste(t,id,qtyBase,reason){const o=refObj(t,id);if(!o)return;const b=batch();const c=t==='i'?'ingredients':'bases';
  b.inc(c,id,-qtyBase);b.set('wastes',{id:uid(),t,refId:id,name:o.name,unit:o.unit,qty:qtyBase,cost:r2(qtyBase*(o.cost||0)),reason,by:ME?ME.name:'',ts:Date.now()});b.commit()}
function stockCount(t,id,counted){const o=refObj(t,id);if(!o)return;const c=t==='i'?'ingredients':'bases';const diff=counted-(o.stock||0);if(!diff)return;
  const b=batch();b.inc(c,id,diff);b.set('adjusts',{id:uid(),t,refId:id,name:o.name,unit:o.unit,diff,value:r2(diff*(o.cost||0)),by:ME?ME.name:'',ts:Date.now()});b.commit()}

/* ---------- reports ---------- */
function paidIn(from,to){return list('orders').filter(o=>o.status==='paid'&&o.bill&&o.bill.paidAt>=from&&o.bill.paidAt<to).sort((a,b)=>a.bill.paidAt-b.bill.paidAt)}
function summary(from,to){
  const os=paidIn(from,to);const R={orders:os,count:os.length,sales:0,gross:0,disc:0,taxable:0,tax:0,cgst:0,sgst:0,svc:0,cost:0,items:0,pay:{},dishes:{},cats:{},hours:{}};
  os.forEach(o=>{const bl=o.bill;R.sales+=bl.total;R.gross+=bl.gross;R.disc+=bl.disc;R.taxable+=bl.taxable;R.tax+=bl.tax;R.cgst+=bl.cgst;R.sgst+=bl.sgst;R.svc+=bl.svc;R.cost+=bl.cost;R.items+=bl.count;
    (bl.pays||[]).forEach(p=>R.pay[p.mode]=(R.pay[p.mode]||0)+p.amt);
    const h=new Date(bl.paidAt).getHours();R.hours[h]=(R.hours[h]||0)+bl.total;
    o.items.forEach(i=>{const k=i.dishId+'|'+i.vName;const r=R.dishes[k]||(R.dishes[k]={name:i.name+(i.vName?' ('+i.vName+')':''),qty:0,rev:0,cost:0,dishId:i.dishId});r.qty+=i.qty;r.rev+=i.price*i.qty;r.cost+=(i.cost||0)*i.qty;
      const d=S.dishes[i.dishId];const cn=d&&S.categories[d.catId]?S.categories[d.catId].name:'Other';R.cats[cn]=(R.cats[cn]||0)+i.price*i.qty})});
  R.sales=r2(R.sales);R.profit=r2(R.taxable-R.cost);R.fc=R.taxable>0?R.cost/R.taxable*100:0;R.avg=R.count?R.sales/R.count:0;
  const ws=list('wastes').filter(w=>w.ts>=from&&w.ts<to);R.waste=r2(ws.reduce((s,w)=>s+w.cost,0));R.wastes=ws;
  return R}
function usageIn(from,to){ // raw consumption from sales
  const m={};paidIn(from,to).forEach(o=>o.items.forEach(i=>(i.use||[]).forEach(u=>{const k=u.t+':'+u.id;m[k]=(m[k]||0)+u.qty*i.qty})));return m}

function toast(msg,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),bad?3800:2200)}
function modal(title,body,{actions=[],wide=false,onOpen,noClose=false}={}){

  ov.innerHTML=`<div class="mdl ${wide?'wide':''}" role="dialog"><header><h3>${title}</h3>${noClose?'':'<button class="x" data-close>×</button>'}</header><div class="bd">${body}</div>${actions.length?'<footer></footer>':''}</div>`;

  if(!noClose){ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});$('[data-close]',ov).onclick=close}

  actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.innerHTML=a.label;b.onclick=async()=>{b.disabled=true;try{const r=a.fn?await a.fn(ov):undefined;if(r!==false)close();else b.disabled=false}catch(e){console.error(e);b.disabled=false;toast(e.message||'Error',true)}};ft.appendChild(b)});

window.addEventListener('beforeunload',e=>{if(V.tab==='order'&&V.dirty&&V.order&&V.order.items.some(i=>i.qty>0)){e.preventDefault();e.returnValue=''}});

function lowCount(){return ings().filter(isLow).length+bases().filter(isLow).length}
function render(force){
  const root=$('#app');if(!root)return;
  const ae=document.activeElement;
  if(!force&&ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&root.contains(ae))return; // don't kill typing
  document.documentElement.dataset.theme=S.settings.theme||'dark';
  if(!S.settings.setupDone){root.innerHTML=Cloud.getCfg()&&!window._cwDone?syncWait():setupView();return}
  if(!ME){root.innerHTML=loginView();return}
  const nav=NAV[ME.role];if(!nav.find(n=>n[0]===V.tab)&&V.tab!=='order')V.tab=nav[0][0];
  const cur=V.tab==='order'?'billing':V.tab;
  const lc=ME.role==='owner'?lowCount():0;
  const items=nav.map(([k,ic,l])=>`<a data-a="go" data-t="${k}" class="${cur===k?'on':''}"><span class="ic">${ic}</span>${l}${k==='stock'&&lc?`<span class="dot">${lc}</span>`:''}</a>`).join('');
  const title=V.tab==='order'?'Order':(nav.find(n=>n[0]===V.tab)||[])[2];
  root.innerHTML=`<div class="shell">
    <aside class="side"><div class="brand"><div class="logo">R</div><div><b>${esc(S.settings.biz.name)}</b><small>RestroFlow</small></div></div>
      <nav class="nav">${items}</nav>
      <div class="foot"><div>${ME.role==='owner'?'👑 Owner':'🧑‍🍳 Cashier'}</div><a class="btn sm ghost" data-a="lock" style="margin-top:6px;color:#f1dfc9">🔒 Lock</a></div></aside>
    <section class="main">
      <div class="top"><h1>${esc(title||'')}</h1><span class="sp"></span>
        <span class="pill" title="${esc(Cloud.err)}"><i id="syncdot" class="sdot ${Cloud.status==='ok'?'ok':Cloud.status==='err'?'err':Cloud.status==='sync'?'sync':''}"></i><span id="synctxt">${Cloud.label()}</span></span>
        <span class="pill">${ME.role==='owner'?'👑':'🧑‍🍳'} ${ME.role}</span>
        <button class="btn sm" data-a="lock">🔒</button></div>
      <div class="content" id="content">${viewFor()}</div>
      <nav class="bnav">${nav.map(([k,ic,l])=>`<a data-a="go" data-t="${k}" class="${cur===k?'on':''}"><span class="ic">${ic}</span>${l}${k==='stock'&&lc?'<span class="dot" style="position:absolute;top:0;right:12px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px">'+lc+'</span>':''}</a>`).join('')}</nav>
    </section></div>`;
  if(window.afterRender)afterRender();
}
window.render=render;
function viewFor(){
  try{const t=V.tab;
    if(t==='home')return homeView();if(t==='billing')return billingView();if(t==='order')return orderView();if(t==='bills')return billsView();
    if(t==='menu')return menuView();if(t==='stock')return stockView();if(t==='reports')return reportsView();if(t==='settings')return settingsView();
    return ''}catch(e){console.error(e);return `<div class="card bad">Error: ${esc(e.message)}</div>`}}
A.lock=async()=>{if(V.tab==='order'&&V.dirty&&V.order&&V.order.items.some(i=>i.qty>0)){try{await commitOrder(V.order)}catch(e){}}SS.del('rf_role');ME=null;V.order=null;V.dirty=false;V.tab='billing';render(true)};

/* ---------- login ---------- */
let LG={role:'owner',pin:''};
function loginView(){
  const b=S.settings.biz;
  return `<div class="login"><div class="card gl lcard">
    <div class="brand" style="justify-content:center"><div class="logo">R</div></div>
    <h2>${esc(b.name)}</h2><div class="mut sm">Enter your PIN to continue</div>
    <div class="rl"><button class="${LG.role==='owner'?'on':''}" data-a="lrole" data-r="owner">👑 Owner</button><button class="${LG.role==='cashier'?'on':''}" data-a="lrole" data-r="cashier">🧑‍🍳 Cashier</button></div>
    <div class="pin">${[0,1,2,3,4,5].map(i=>`<i class="${i<LG.pin.length?'f':''}" style="${i>=4&&LG.pin.length<5&&i>=LG.pin.length?'display:none':''}"></i>`).join('')}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button data-a="lkey" data-k="${k}">${k}</button>`).join('')}</div>
    <div id="lerr" class="bad sm" style="min-height:20px;margin-top:8px"></div>
  </div></div>`}
A.lrole=d=>{LG.role=d.r;LG.pin='';render(true)};
A.lkey=async d=>{const k=d.k;
  if(k==='⌫')LG.pin=LG.pin.slice(0,-1);else if(k==='OK'){return tryLogin()}else if(LG.pin.length<6)LG.pin+=k;
  render(true);if(LG.pin.length===4&&k!=='OK'){/* wait for OK or 5th digit */}};
async function tryLogin(){
  const h=await sha(LG.pin);const want=S.settings.pins[LG.role];
  if(want&&h===want){ME={role:LG.role,name:LG.role==='owner'?'Owner':'Cashier'};SS.set('rf_role',LG.role);LG.pin='';V.tab=ME.role==='owner'?'home':'billing';render(true)}
  else{LG.pin='';render(true);const e=$('#lerr');if(e)e.textContent='Wrong PIN'}}
document.addEventListener('keydown',e=>{if(ME||!S||!S.settings.setupDone)return;if(/^[0-9]$/.test(e.key))A.lkey({k:e.key});else if(e.key==='Backspace')A.lkey({k:'⌫'});else if(e.key==='Enter')A.lkey({k:'OK'})});

  s.pins.owner=await sha(f.op);s.pins.cashier=await sha(f.cp);s.setupDone=true;
  if(f.demo)loadDemo();else{for(let i=1;i<=8;i++)S.tables['t'+i]={id:'t'+i,name:'Table '+i,sec:'Main'}}
  saveSettings();render(true)});
A.usecode=()=>{modal('Setup code',`<p class="mut sm">Paste the setup code from your main device (Settings → Cloud Sync → Copy setup code).</p><textarea id="sc" rows="4" placeholder="Paste code here"></textarea>`,{actions:[{label:'Cancel'},{label:'Connect',cls:'pri',fn:()=>{try{const c=JSON.parse(decodeURIComponent(escape(atob($('#sc').value.trim()))));if(!c.cfg||!c.email)throw 0;Cloud.setCfg(c);location.reload()}catch(e){toast('Invalid code',true);return false}}}]})};

'use strict';
/* ============ Billing: tables, order screen, pay, receipts, bill history ============ */
const IN={};
function natSort(a,b){return String(a.name).localeCompare(String(b.name),undefined,{numeric:true})}
function typeIcon(t){return{dine:'🍽️',take:'🛍️',delivery:'🛵',room:'🛏️'}[t]||'🧾'}

  const tables=list('tables').sort(natSort),oo=openOrders();

  const today=summary(sod(Date.now()),Date.now()+DAY);

      <div class="row"><button class="btn pri" data-a="newq" data-t="take">🛍️ Takeaway</button><button class="btn mar" data-a="newq" data-t="delivery">🛵 Delivery</button><button class="btn" data-a="newq" data-t="room">🛏️ Room service</button></div>
      <div class="pill">Today: <b class="gold">${money(today.sales)}</b> · ${today.count} bills · ${oo.length} running</div></div>
    ${Object.keys(secs).map(k=>`<h3 class="title mut">${esc(k)}</h3><div class="tbl-grid" style="margin-bottom:16px">${secs[k].map(t=>{const o=openOrderFor(t.id);

      const c=calcBill(o);return `<div class="tcard busy" data-a="opentable" data-id="${t.id}"><b>${esc(t.name)}</b><div><div class="gold b">${money(c.total)}</div><div class="sm mut">${c.count} items · ${ago(o.createdAt)}</div></div></div>`}).join('')}</div>`).join('')||'<div class="card mut">No tables yet. Add tables in Settings → Tables.</div>'}
    ${others.length?`<h3 class="title mut">Running takeaway / delivery / room orders</h3><div class="tbl-grid">${others.map(o=>{const c=calcBill(o);return `<div class="tcard busy" data-a="openord" data-id="${o.id}"><b>${typeIcon(o.type)} ${esc(orderTitle(o))}</b><div><div class="gold b">${money(c.total)}</div><div class="sm mut">${c.count} items · ${ago(o.createdAt)}</div></div></div>`}).join('')}</div>`:''}`}

A.openord=d=>{V.order=clone(S.orders[d.id]);V.dirty=false;V.q='';V.cat='all';go('order')};
A.newq=d=>{
  const mk=label=>{V.order=newOrder(d.t,null,label);V.dirty=false;V.q='';V.cat='all';go('order')};
  if(d.t==='room'){const ov=modal('Room service',`${field('Room number','<input id="rn" placeholder="e.g. 204">')}`,{actions:[{label:'Cancel'},{label:'Start',cls:'pri',fn:()=>{const v=$('#rn').value.trim();if(!v){toast('Enter room number',true);return false}mk(v)}}]})}
  else mk('')};

/* ---------- order screen ---------- */
function filteredDishes(){

function dishGrid(){
  return filteredDishes().map(d=>{const vs=variantsOf(d);const cm=canMake(d,vs[0]);const out=cm===0;
    const pr=vs.length>1?'from '+money(Math.min(...vs.map(v=>num(v.price)))):money(vs[0].price);
    return `<div class="dish ${out?'out':''}" data-a="adddish" data-id="${d.id}"><div class="row" style="gap:6px;flex-wrap:nowrap">${vegDot(d.veg)}<span class="nm">${esc(d.name)}</span></div><div class="pr">${pr}</div>${out?'<span class="badge bad" style="position:absolute;top:8px;right:8px">Out</span>':(cm!=null&&cm<=3&&ME.role==='owner'?`<span class="badge warn" style="position:absolute;top:8px;right:8px">${cm} left</span>`:'')}${vs.length>1?'<span class="sm mut">'+vs.length+' sizes</span>':''}</div>`}).join('')||'<div class="mut" style="grid-column:1/-1;padding:20px">No dishes found.</div>'}
IN.q=v=>{V.q=v;const g=$('#dgrid');if(g)g.innerHTML=dishGrid()};
A.setcat=d=>{V.cat=d.c;render(true)};
function orderView(){
  const D=V.order;if(!D)return '';
  const cats=list('categories').sort((a,b)=>(a.sort||0)-(b.sort||0)||natSort(a,b));

    </div>
    <div class="cart card gl ${V.cartOpen?'open':''}" id="cart">
      <div class="row sb"><h3>Current order</h3><button class="btn sm cartbar-x" data-a="closecart" style="display:${V.cartOpen?'inline-flex':'none'}">✕ Close</button></div>
      <div class="items">${items.length?items.map(i=>`<div class="ci"><div><div class="b">${vegDot(i.veg)} ${esc(i.name)}${i.vName?' <span class="mut">('+esc(i.vName)+')</span>':''}</div>
        <div class="sm mut">${money(i.price)} each ${i.qty>i.sent?'<span class="badge gold">new '+(i.qty-i.sent)+'</span>':'<span class="badge ok">sent</span>'} <a data-a="note" data-u="${i.uid}" style="cursor:pointer;color:var(--cyan)">${i.note?'📝 '+esc(i.note):'+ note'}</a></div></div>
        <div class="stp"><button data-a="qinc" data-u="${i.uid}" data-d="-1">−</button><span>${i.qty}</span><button data-a="qinc" data-u="${i.uid}" data-d="1">+</button></div>
        <div class="b r" style="min-width:64px">${money(i.price*i.qty)}</div></div>`).join(''):'<div class="mut c" style="padding:30px 0">Tap a dish to add it 🍽️</div>'}</div>
      <div class="sum">
        <div><span>Subtotal</span><span>${money(c.gross)}</span></div>
        ${c.disc?`<div><span>Discount</span><span class="ok">− ${money(c.disc)}</span></div>`:''}

      <div class="two"><button class="btn mar lg" data-a="kot" ${unsent?'':'disabled'}>🔔 KOT${unsent?' ('+unsent+')':''}</button><button class="btn lg" data-a="saveord" ${V.dirty?'':'disabled'}>💾 Save</button></div>
      <button class="btn pri lg full" style="margin-top:8px" data-a="pay" ${items.length?'':'disabled'}>💳 Bill & Pay  ${money(c.total)}</button>
    </div></div>`}
function afterRender(){}
const touch=()=>{V.dirty=true};
A.opencart=()=>{V.cartOpen=true;render(true)};A.closecart=()=>{V.cartOpen=false;render(true)};
A.adddish=d=>{
  const dish=S.dishes[d.id];if(!dish)return;const vs=variantsOf(dish);
  const add=vi=>{const v=vs[vi];const cm=canMake(dish,v);
    if(cm===0&&S.settings.blockOut){toast(dish.name+' is out of stock',true);return}
    if(cm===0)toast('⚠ Stock low for '+dish.name,true);
    addItem(V.order,dish,vi);touch();render(true)};
  if(vs.length>1){const ov=modal(esc(dish.name),`<div class="col">${vs.map((v,i)=>`<button class="btn lg" data-vi="${i}"><span>${esc(v.name||'Regular')}</span><b class="gold">${money(v.price)}</b></button>`).join('')}</div>`);$$('[data-vi]',ov).forEach(b=>b.onclick=()=>{ov.close();add(+b.dataset.vi)})}
  else add(0)};
A.qinc=async d=>{const D=V.order,it=D.items.find(i=>i.uid===d.u);if(!it)return;const nq=Math.max(0,it.qty+num(d.d));
  if(nq<it.sent){const ok=await confirmBox('This item was already sent to the kitchen. Reduce / remove it?','Yes, reduce','dang');if(!ok)return;
    if(ME.role!=='owner'&&nq===0){const a=await ownerAuth('Removing a sent item needs Owner approval');if(!a)return}
    D.voids.push({n:it.name,q:it.sent-nq,at:Date.now(),by:ME.name});it.sent=nq}
  it.qty=nq;touch();render(true)};
A.note=d=>{const it=V.order.items.find(i=>i.uid===d.u);modal('Note for kitchen',`<input id="nt" value="${esc(it.note)}" placeholder="e.g. less spicy, no onion">`,{actions:[{label:'Cancel'},{label:'Save',cls:'pri',fn:()=>{it.note=$('#nt').value.trim();touch();render(true)}}]})};
A.svct=(d,el)=>{V.order.svc=el.checked;touch();render(true)};
A.disc=()=>{const D=V.order;const cur=D.discount||{type:'pct',value:''};
  modal('Discount',`<div class="two">${field('Type',`<select id="dt">${opt('pct','Percent %',cur.type)}${opt('amt','Amount '+(S.settings.curr),cur.type)}</select>`)}${field('Value','<input id="dv" type="number" step="any" min="0" value="'+esc(cur.value)+'">')}</div>`,
    {actions:[{label:'Remove',cls:'dang',fn:()=>{D.discount=null;touch();render(true)}},{label:'Apply',cls:'pri',fn:()=>{const v=num($('#dv').value);D.discount=v>0?{type:$('#dt').value,value:v}:null;touch();render(true)}}]})};
A.custm=()=>{const D=V.order;modal('Customer / order details',`${field('Customer name','<input id="cn" value="'+esc(D.customer.name)+'">')}${field('Phone (for WhatsApp bill)','<input id="cp" inputmode="tel" value="'+esc(D.customer.phone)+'">')}${D.type!=='dine'?field(D.type==='delivery'?'Address / label':D.type==='room'?'Room':'Token / label','<input id="cl" value="'+esc(D.label)+'">'):''}${field('Order note','<input id="on" value="'+esc(D.note)+'">')}`,
  {actions:[{label:'Cancel'},{label:'Save',cls:'pri',fn:()=>{D.customer={name:$('#cn').value.trim(),phone:$('#cp').value.trim()};if($('#cl'))D.label=$('#cl').value.trim();D.note=$('#on').value.trim();touch();render(true)}}]})};
A.backorder=async()=>{
  const D=V.order;const has=D.items.some(i=>i.qty>0);
  if(V.dirty&&(has||S.orders[D.id])){const ov=modal('Unsaved changes','<p style="margin:0">Save this order before leaving?</p>',{actions:[{label:'Discard',cls:'dang',fn:()=>{V.order=null;go('billing')}},{label:'Save & leave',cls:'pri',fn:async()=>{await commitOrder(D);go('billing')}}]});return}
  go('billing')};
A.saveord=async()=>{const r=await commitOrder(V.order);V.dirty=false;V.order=r?clone(r):null;if(!r){go('billing');toast('Empty order removed');return}toast('Order saved');render(true)};
A.kot=async()=>{const D=V.order;const fresh=D.items.filter(i=>i.qty>i.sent).map(i=>({...i,q:i.qty-i.sent}));
  const r=await commitOrder(D,{kot:true});V.dirty=false;V.order=r?clone(r):null;
  if(r){printHTML(kotHTML(r,fresh));toast('KOT sent to kitchen')}render(true)};
A.cancelord=async()=>{const D=V.order;const sent=D.items.some(i=>i.sent>0);
  if(!D.items.some(i=>i.qty>0)&&!S.orders[D.id]){V.order=null;go('billing');return}
  if(sent&&!(await ownerAuth('Cancelling an order already sent to the kitchen needs Owner approval')))return;
  const ov=modal('Cancel order',`${field('Reason','<select id="cr">'+['Customer left','Wrong order','Kitchen could not make','Duplicate','Other'].map(x=>opt(x,x)).join('')+'</select>')}${sent?'<label class="row sm"><input type="checkbox" id="crs"> Food was already cooked — count as wastage (do NOT return stock)</label>':''}`,
    {actions:[{label:'Back'},{label:'Cancel order',cls:'dang',fn:async()=>{const waste=sent&&$('#crs').checked;await cancelOrder(D,$('#cr').value,!waste);V.order=null;go('billing');toast('Order cancelled')}}]})};

A.pay=()=>{

  const ov=modal('Bill & Pay',`<div class="kpi" style="margin-bottom:12px"><small>Amount to pay</small><b>${money(c.total)}</b><i>${c.count} items${c.tax?' · incl. GST '+money(c.tax):''}</i></div>
    <div class="row" style="margin-bottom:10px"><button class="btn ok" data-pm="cash">💵 All Cash</button><button class="btn" data-pm="upi">📲 All UPI</button><button class="btn" data-pm="card">💳 All Card</button></div>
    <div class="three p3">${field('Cash','<input id="p_cash" type="number" step="any" value="'+c.total+'">')}${field('UPI','<input id="p_upi" type="number" step="any" value="0">')}${field('Card','<input id="p_card" type="number" step="any" value="0">')}</div>
    <div class="two">${field('Cash received (for change)','<input id="p_rec" type="number" step="any" placeholder="optional">')}${field('Change to return','<input id="p_chg" readonly value="0">')}</div>
    ${field('Customer phone (WhatsApp bill)','<input id="p_ph" inputmode="tel" value="'+esc(D.customer.phone||'')+'">')}
    <div id="perr" class="bad sm"></div>`,
    {actions:[{label:'Back'},{label:'✔ Confirm',cls:'ok',fn:()=>doPay(ov,c,false)},{label:'🖨️ Confirm & Print',cls:'pri',fn:()=>doPay(ov,c,true)}]});
  const upd=()=>{const rec=num($('#p_rec').value),cash=num($('#p_cash').value);$('#p_chg').value=rec>cash?r2(rec-cash):0};
  $$('[data-pm]',ov).forEach(b=>b.onclick=()=>{['cash','upi','card'].forEach(m=>$('#p_'+m).value=m===b.dataset.pm?c.total:0);upd()});
  $('#p_rec').oninput=upd;$('#p_cash').oninput=upd};
async function doPay(ov,c,print){
  const pays=['cash','upi','card'].map(m=>({mode:m,amt:r2(num($('#p_'+m).value))})).filter(p=>p.amt>0);
  const sum=r2(pays.reduce((s,p)=>s+p.amt,0));
  if(Math.abs(sum-c.total)>0.5){$('#perr').textContent='Payments ('+money(sum)+') must equal the total ('+money(c.total)+')';return false}
  const D=V.order;const ph=$('#p_ph').value.trim();const cust=Object.assign({},D.customer,{phone:ph});
  const o=await payOrder(D,pays,cust);if(!o)return false;
  V.order=null;V.dirty=false;go('billing');
  showReceipt(o.id,print);return true}

'use strict';
/* ============ Owner views part 2: Stock, purchases, gravy batches, wastage, count ============ */

function rawView(){return `<div class="row sb" style="margin-bottom:10px"><input data-in="rq" placeholder="Search…" value="${esc(V.sub.rq||'')}" style="max-width:260px"><button class="btn pri" data-a="editing">＋ Add raw material</button></div>

  ${bases().map(o=>`<tr class="clk" data-a="editbase" data-id="${o.id}"><td><b>${esc(o.name)}</b></td><td class="r b ${(o.stock||0)<=0?'bad':isLow(o)?'warn':''}">${fq(o.stock,o.unit)}</td><td class="r mut">${o.min?fq(o.min,o.unit):'—'}</td><td class="r">${money(o.cost*FACT[o.unit])}/${ulabel(o.unit)}</td><td class="r">${o.yield?fq(o.yield,o.unit):'—'}</td><td>${stockStatus(o)}</td></tr>`).join('')||'<tr><td colspan="6" class="c mut" style="padding:30px">No gravy bases yet.</td></tr>'}</tbody></table></div>

let EB=null;

  <h3 class="title">Batch recipe <span class="mut sm">(raw materials for ONE batch, in g / ml / pcs)</span></h3>
  ${EB.recipe.map((l,i)=>{const o=S.ingredients[l.id];return `<div class="rline"><select name="rs${i}">${recOptions('i','i:'+l.id)}</select><input name="rq${i}" type="number" step="any" value="${l.qty||''}" placeholder="Qty"><span class="mut sm" style="min-width:30px">${o?BASEU[o.unit]:'g/ml'}</span><button class="btn sm dang" data-a="rmbl" data-i="${i}">✕</button></div>`}).join('')}

function syncBase(){const r=$('#be');if(!r)return;const f=formData(r);EB.name=f.name;if(!EB.id)EB.unit=f.unit;EB.yield=num(f.yield)*FACT[EB.unit];EB.min=num(f.min)*FACT[EB.unit];if(!EB.id)EB.stock=num(f.stock)*FACT[EB.unit];

function baseSum(){const c=EB.recipe.reduce((s,l)=>s+l.qty*unitCost('i',l.id),0);return `Cost of one batch: <b>${money(c)}</b>${EB.yield?` · cost per ${ulabel(EB.unit)}: <b>${money(c/(EB.yield/FACT[EB.unit]))}</b>`:''}`}

A.addbl=()=>{syncBase();EB.recipe.push({id:'',qty:0});refreshBase()};A.rmbl=d=>{syncBase();EB.recipe.splice(+d.i,1);refreshBase()};

/* make batch */
A.mkbatch=()=>{
  const bs=bases();if(!bs.length){toast('Add a gravy base first',true);return}
  const MB={id:bs[0].id,n:1,act:null};
  const draw=ov=>{const b=S.bases[MB.id],F=FACT[b.unit];const exp=(b.yield||0)*MB.n;const act=MB.act==null?exp:MB.act*F;
    const lines=(b.recipe||[]).map(l=>({id:l.id,qty:l.qty*MB.n,o:S.ingredients[l.id]}));
    const cost=lines.reduce((s,l)=>s+l.qty*unitCost('i',l.id),0);const lack=lines.some(l=>l.o&&(l.o.stock||0)<l.qty);
    $('.bd',ov).innerHTML=`<div class="two">${field('Gravy base','<select id="mb_b">'+bs.map(x=>opt(x.id,x.name,MB.id)).join('')+'</select>')}${field('Number of batches','<input id="mb_n" type="number" min="1" step="1" value="'+MB.n+'">')}</div>
    ${field('Actual quantity made ('+ulabel(b.unit)+') — change if less/more came out','<input id="mb_y" type="number" step="any" value="'+r2n(act/F)+'">')}
    ${lines.length?`<table class="t"><thead><tr><th>Raw material used</th><th class="r">Needed</th><th class="r">In stock</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${l.o?esc(l.o.name):'(deleted)'}</td><td class="r">${l.o?fq(l.qty,l.o.unit):''}</td><td class="r ${l.o&&(l.o.stock||0)<l.qty?'bad b':''}">${l.o?fq(l.o.stock,l.o.unit):''}</td></tr>`).join('')}</tbody></table>`:'<div class="help">This base has no batch recipe yet — edit it and add the raw materials.</div>'}
    <div class="help" style="margin-top:10px">Batch cost: <b>${money(cost)}</b> · per ${ulabel(b.unit)}: <b>${act?money(cost/(act/F)):'—'}</b>${lack?' · <b class="bad">⚠ some raw material is short (stock will go negative)</b>':''}</div>`;
    $('#mb_b').onchange=e=>{MB.id=e.target.value;MB.act=null;draw(ov)};$('#mb_n').onchange=e=>{MB.n=Math.max(1,num(e.target.value));MB.act=null;draw(ov)};$('#mb_y').onchange=e=>{MB.act=num(e.target.value);draw(ov)};
    ov._cur={b,act,lines}};
  const ov=modal('🍛 Make gravy batch','',{actions:[{label:'Cancel'},{label:'Produce',cls:'pri',fn:()=>{const {b,act,lines}=ov._cur;if(!lines.length){toast('Add a batch recipe first',true);return false}if(!(act>0)){toast('Enter quantity made',true);return false}produceBatch(b.id,act,lines.map(l=>({id:l.id,qty:l.qty})));toast('Batch added to stock')}}]});
  draw(ov)};

function rangeOf(k){const t=sod(Date.now());const d=new Date();
  if(k==='today')return[t,t+DAY,'Today'];if(k==='yday')return[t-DAY,t,'Yesterday'];if(k==='7d')return[t-6*DAY,t+DAY,'Last 7 days'];
  if(k==='month')return[new Date(d.getFullYear(),d.getMonth(),1).getTime(),t+DAY,'This month'];
  if(k==='lmonth')return[new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),new Date(d.getFullYear(),d.getMonth(),1).getTime(),'Last month'];
  const f=V.sub.f?new Date(V.sub.f+'T00:00:00').getTime():t,e=V.sub.e?new Date(V.sub.e+'T00:00:00').getTime()+DAY:t+DAY;return[f,e,'Custom']}

   <div class="card"><h3 class="title">💳 Payment modes</h3>${Object.entries(R.pay).map(([m,v])=>`<div style="margin-bottom:8px"><div class="row sb"><span>${m.toUpperCase()}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/(R.sales||1)*100}%"></i></div></div>`).join('')||'<div class="mut">No data</div>'}</div>
   <div class="card"><h3 class="title">🗂️ Sales by category</h3>${Object.entries(R.cats).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div style="margin-bottom:8px"><div class="row sb"><span>${esc(n)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/catTot*100}%"></i></div></div>`).join('')||'<div class="mut">No data</div>'}</div>

A.copycode=()=>{const c=Cloud.getCfg();const code=btoa(unescape(encodeURIComponent(JSON.stringify(c))));(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast('Setup code copied'),()=>modal('Setup code',`<textarea rows="5" readonly onclick="this.select()">${code}</textarea>`))};
A.cloudoff=async()=>{if(!(await confirmBox('Disconnect cloud sync on this device? Data stays here and in the cloud.','Disconnect','dang')))return;Cloud.setCfg(null);location.reload()};
A.addtables=()=>modal('Add tables',`<div class="two">${field('Name prefix','<input id="tp" value="Table">')}${field('How many','<input id="tn" type="number" value="5" min="1" max="60">')}</div><div class="two">${field('Start number','<input id="ts" type="number" value="'+(list('tables').length+1)+'">')}${field('Section','<input id="tc" value="Main Hall">')}</div>`,{actions:[{label:'Cancel'},{label:'Add',cls:'pri',fn:()=>{const b=batch(),n=Math.min(60,num($('#tn').value)),st=num($('#ts').value)||1;for(let i=0;i<n;i++)b.set('tables',{id:uid(),name:$('#tp').value.trim()+' '+(st+i),sec:$('#tc').value.trim()||'Main'});b.commit()}}]});
A.rentables=()=>modal('Rename / delete tables',`<div class="col">${list('tables').sort(natSort).map(t=>`<div class="row" style="flex-wrap:nowrap"><input data-tn="${t.id}" value="${esc(t.name)}"><input data-ts="${t.id}" value="${esc(t.sec||'')}" style="max-width:130px"><button class="btn sm dang" data-a="deltable" data-id="${t.id}">✕</button></div>`).join('')}</div>`,{wide:true,actions:[{label:'Close'},{label:'Save changes',cls:'pri',fn:()=>{const b=batch();$$('[data-tn]').forEach(i=>{const t=S.tables[i.dataset.tn];if(t&&t.name!==i.value.trim()||t&&t.sec!==$(`[data-ts="${t.id}"]`).value.trim())b.set('tables',Object.assign({},t,{name:i.value.trim()||t.name,sec:$(`[data-ts="${t.id}"]`).value.trim()||'Main'}))});b.commit()}}]});
A.deltable=async d=>{if(openOrderFor(d.id)){toast('Table has a running order',true);return}const b=batch();b.del('tables',d.id);b.commit();$(`[data-tn="${d.id}"]`).parentNode.remove()};
A.chpin=d=>modal('Change '+d.r+' PIN',`${field('New PIN (4–6 digits)','<input id="np" inputmode="numeric" maxlength="6" type="password">')}`,{actions:[{label:'Cancel'},{label:'Save',cls:'pri',fn:async()=>{const v=$('#np').value;if(!/^\d{4,6}$/.test(v)){toast('PIN must be 4 to 6 digits',true);return false}const h=await sha(v);const other=d.r==='owner'?'cashier':'owner';if(h===S.settings.pins[other]){toast('Owner and cashier PIN must differ',true);return false}S.settings.pins[d.r]=h;saveSettings();toast('PIN changed')}}]});
A.backup=()=>{dl('restroflow-backup-'+ymd(Date.now())+'.json',JSON.stringify(S));toast('Backup downloaded')};
A.restore=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const st=normalize(JSON.parse(await i.files[0].text()));if(!(await confirmBox('Replace ALL current data with this backup?','Restore','dang')))return;S=st;persist();if(Cloud.on)await Cloud.pushAll();toast('Restored');render(true)}catch(e){toast('Invalid backup file',true)}};i.click()};
A.wipe=async d=>{const all=d.k==='all';if(!(await confirmBox(all?'Delete your menu, stock, tables and ALL history? This cannot be undone. (Settings & PINs stay.)':'Delete all bills, purchases, wastage and batch history? Menu and stock levels stay.','Delete','dang')))return;
  const b=batch();const cs=all?COLLS:['orders','purchases','wastes','batches','adjusts'];cs.forEach(c=>Object.keys(S[c]).forEach(id=>b.del(c,id)));if(!all){S.counters={bill:0,order:0}}b.commit();toast('Deleted')};

'use strict';
/* ============ demo data (Indian restaurant) ============ */
function loadDemo(){
  const b=batch();const I={},B={},C={};
  const ing=(k,name,unit,price,stock,min)=>{const F=FACT[unit];I[k]=b.set('ingredients',{id:'i_'+k,name,unit,cost:r2n(price/F),stock:stock*F,min:min*F})};
  ing('chicken','Chicken','kg',210,25,5);ing('mutton','Mutton','kg',720,10,3);ing('paneer','Paneer','kg',340,8,2);ing('rice','Basmati Rice','kg',120,30,8);
  ing('atta','Wheat Flour (Atta)','kg',42,25,8);ing('maida','Maida','kg',45,15,5);ing('onion','Onion','kg',35,30,8);ing('tomato','Tomato','kg',40,20,6);
  ing('cashew','Cashew','kg',820,3,1);ing('oil','Cooking Oil','l',130,20,5);ing('butter','Butter','kg',560,5,1);ing('cream','Fresh Cream','l',250,4,1);
  ing('curd','Curd','kg',70,8,2);ing('gg','Ginger-Garlic Paste','kg',180,4,1);ing('dal','Toor Dal','kg',150,10,3);ing('garam','Garam Masala','kg',600,1.5,0.3);
  ing('chilli','Red Chilli Powder','kg',320,2,0.5);ing('turmeric','Turmeric','kg',180,1.5,0.3);ing('bmasala','Biryani Masala','kg',650,1.5,0.3);ing('kmethi','Kasuri Methi','kg',700,0.5,0.1);
  ing('salt','Salt','kg',20,10,2);ing('sugar','Sugar','kg',45,10,2);ing('egg','Eggs','pcs',7,120,30);ing('cola','Soft Drink Bottle','pcs',18,48,12);ing('water','Water Bottle','pcs',10,60,12);
  const base=(k,name,unit,yieldQty,stock,min,rec)=>{const F=FACT[unit];const cost=rec.reduce((s,[i,q])=>s+q*I[i].cost,0)/(yieldQty*F);
    B[k]=b.set('bases',{id:'b_'+k,name,unit,yield:yieldQty*F,stock:stock*F,min:min*F,cost:r2n(cost),recipe:rec.map(([i,q])=>({id:I[i].id,qty:q}))})};
  base('red','Red Gravy (Onion-Tomato)','kg',6,9,2,[['onion',4000],['tomato',2500],['oil',500],['gg',300],['turmeric',30],['chilli',80],['salt',80]]);
  base('makhani','Makhani Gravy','kg',5,6,1.5,[['tomato',3000],['butter',300],['cream',400],['cashew',250],['gg',150],['chilli',40],['kmethi',20],['salt',50]]);
  base('dal','Cooked Dal Base','kg',10,8,2,[['dal',2000],['onion',400],['tomato',400],['oil',150],['turmeric',20],['salt',60]]);
  const cat=(k,name,sort)=>{C[k]=b.set('categories',{id:'c_'+k,name,sort})};
  cat('st','Starters',1);cat('nv','Main Course — Non-Veg',2);cat('vg','Main Course — Veg',3);cat('ri','Rice & Biryani',4);cat('br','Breads',5);cat('dr','Drinks',6);
  const R=(t,k,q)=>({t,id:(t==='i'?I:B)[k].id,qty:q});
  const dish=(k,name,cc,veg,price,rec,variants)=>b.set('dishes',{id:'d_'+k,name,catId:C[cc].id,veg,price:variants?Math.min(...variants.map(v=>v.price)):price,gst:null,active:true,variants:variants||[],recipe:rec});
  dish('bc','Butter Chicken','nv','nonveg',320,[R('i','chicken',250),R('b','makhani',200),R('i','butter',15),R('i','cream',20)],[{name:'Half',price:190,factor:0.55},{name:'Full',price:320,factor:1}]);
  dish('cm','Chicken Masala','nv','nonveg',280,[R('i','chicken',250),R('b','red',200),R('i','oil',20),R('i','garam',4)],[{name:'Half',price:160,factor:0.55},{name:'Full',price:280,factor:1}]);
  dish('mm','Mutton Masala','nv','nonveg',420,[R('i','mutton',250),R('b','red',220),R('i','oil',25),R('i','garam',5)],[{name:'Half',price:240,factor:0.55},{name:'Full',price:420,factor:1}]);
  dish('ec','Egg Curry','nv','egg',180,[R('i','egg',2),R('b','red',200),R('i','oil',10)]);
  dish('pbm','Paneer Butter Masala','vg','veg',260,[R('i','paneer',150),R('b','makhani',200),R('i','butter',10),R('i','cream',20)]);
  dish('kp','Kadai Paneer','vg','veg',250,[R('i','paneer',150),R('b','red',180),R('i','oil',15),R('i','garam',3)]);
  dish('dt','Dal Tadka','vg','veg',160,[R('b','dal',250),R('i','oil',15),R('i','chilli',2)]);
  dish('cb','Chicken Biryani','ri','nonveg',260,[R('i','rice',150),R('i','chicken',200),R('i','bmasala',12),R('i','oil',30),R('i','onion',60),R('i','curd',40)]);
  dish('vb','Veg Biryani','ri','veg',190,[R('i','rice',150),R('i','bmasala',10),R('i','oil',25),R('i','onion',60),R('i','curd',40),R('b','red',100)]);
  dish('jr','Jeera Rice','ri','veg',120,[R('i','rice',150),R('i','oil',10),R('i','salt',3)]);
  dish('bn','Butter Naan','br','veg',50,[R('i','maida',100),R('i','butter',8),R('i','curd',15),R('i','oil',5)]);
  dish('tr','Tandoori Roti','br','veg',20,[R('i','atta',70)]);
  dish('ct','Chicken Tikka','st','nonveg',280,[R('i','chicken',200),R('i','curd',50),R('i','gg',15),R('i','chilli',5),R('i','oil',15)]);
  dish('pt','Paneer Tikka','st','veg',240,[R('i','paneer',150),R('i','curd',50),R('i','gg',10),R('i','chilli',5),R('i','oil',10)]);
  dish('sd','Soft Drink','dr','veg',40,[R('i','cola',1)]);
  dish('pw','Packaged Water','dr','veg',20,[R('i','water',1)]);
  dish('ls','Sweet Lassi','dr','veg',70,[R('i','curd',200),R('i','sugar',25)]);
  for(let i=1;i<=8;i++)b.set('tables',{id:'t'+i,name:'Table '+i,sec:'Main Hall'});
  for(let i=9;i<=12;i++)b.set('tables',{id:'t'+i,name:'Table '+i,sec:'Family Section'});
  b.commit()}

'use strict';
/* ============ boot ============ */
(async function boot(){
  S=normalize(await loadLocal());
  const role=SS.get('rf_role');
  if(role&&S.settings.setupDone&&NAV[role])ME={role,name:role==='owner'?'Owner':'Cashier'};
  V.tab=ME&&ME.role==='owner'?'home':'billing';
  render(true);
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.addEventListener('beforeunload',()=>{});
  setTimeout(()=>{window._cwDone=true;if(!S.settings.setupDone)render(true)},10000);
  await Cloud.start();
})();
